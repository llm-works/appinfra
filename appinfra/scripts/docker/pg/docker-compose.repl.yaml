# PostgreSQL Replication Mode (Primary + Standby)
# Essential replication params come first; user knobs from pgserver.postgres_conf
# fill the named slots below (curated whitelist; see docker-compose.single.yaml).
#
# pg.sh-orchestrated: reads the _APPINFRA_PG_* wire variables from the
# environment. CONTAINER_NAME / IMAGE / PORT / PORT_R are required; the
# postgres_conf slots default to postgres's built-in values when unset. Not
# intended for direct `docker compose -f ...` invocation.
services:
  postgres-primary:
    container_name: ${_APPINFRA_PG_CONTAINER_NAME:?}-primary
    image: ${_APPINFRA_PG_IMAGE:?}
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - hot_standby=on
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - ${_APPINFRA_PG_MAX_CONNECTIONS:-max_connections=128}
      - -c
      - ${_APPINFRA_PG_SHARED_PRELOAD_LIBRARIES:-shared_preload_libraries=}
      - -c
      - ${_APPINFRA_PG_WORK_MEM:-work_mem=4MB}
      - -c
      - ${_APPINFRA_PG_AUTOVACUUM:-autovacuum=on}
    restart: always
    volumes:
      - "$PWD:$PWD"
      # Mount one level above PGDATA: pg18+ uses /var/lib/postgresql/<MAJOR>/docker
      # and refuses to start when the mount lands on /var/lib/postgresql/data.
      - pgdata_primary:/var/lib/postgresql
      - ${PWD}/scripts/docker/pg/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    working_dir: $PWD
    ports:
      - ${_APPINFRA_PG_PORT:?}:${_APPINFRA_PG_PORT}
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - PGPORT=${_APPINFRA_PG_PORT}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-standby:
    container_name: ${_APPINFRA_PG_CONTAINER_NAME:?}-standby
    image: ${_APPINFRA_PG_IMAGE:?}
    restart: always
    volumes:
      - "$PWD:$PWD"
      # Mount one level above PGDATA (see primary comment).
      - pgdata_standby:/var/lib/postgresql
    working_dir: $PWD
    ports:
      - ${_APPINFRA_PG_PORT_R:?}:${_APPINFRA_PG_PORT_R}
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - PGPORT=${_APPINFRA_PG_PORT_R}
    depends_on:
      postgres-primary:
        condition: service_healthy
    entrypoint: >
      bash -c "
        pgdata=\"$${PGDATA:-/var/lib/postgresql/data}\"
        # pg18+ PGDATA is /var/lib/postgresql/<MAJOR>/docker; the <MAJOR>/ layer
        # is created root:root 0700 (from the image or by pg_basebackup) and would
        # block traversal by the postgres user. Pre-create the parent as postgres.
        install -d -o postgres -g postgres -m 755 \"$$(dirname \"$$pgdata\")\"
        rm -rf \"$$pgdata\"/*
        until pg_isready -h postgres-primary -p ${_APPINFRA_PG_PORT} -U postgres; do
          echo 'Waiting for primary to be ready...'
          sleep 2
        done
        echo 'Primary is ready, starting base backup...'
        PGPASSWORD='' pg_basebackup -h postgres-primary -p ${_APPINFRA_PG_PORT} -U postgres -D \"$$pgdata\" -Fp -Xs -P -R
        chown -R postgres:postgres \"$$pgdata\"
        chmod 0700 \"$$pgdata\"
        echo 'Base backup complete, starting standby server...'
        exec gosu postgres postgres \
          -c \"${_APPINFRA_PG_MAX_CONNECTIONS:-max_connections=128}\" \
          -c \"${_APPINFRA_PG_SHARED_PRELOAD_LIBRARIES:-shared_preload_libraries=}\" \
          -c \"${_APPINFRA_PG_WORK_MEM:-work_mem=4MB}\" \
          -c \"${_APPINFRA_PG_AUTOVACUUM:-autovacuum=on}\"
      "

volumes:
  pgdata_primary:
  pgdata_standby:
