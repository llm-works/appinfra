# pg_hba.conf for a pgserver without a password (pgserver.pass empty).
# pg.sh mounts it as /etc/postgresql/pg_hba.conf (hba_file) in every container.
#
# Every connection is trusted. The published ports listen on pgserver.bind,
# 127.0.0.1 by default, so only this machine reaches them.
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
host    all             all             all                     trust
host    replication     all             all                     trust
