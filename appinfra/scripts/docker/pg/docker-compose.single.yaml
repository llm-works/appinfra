# PostgreSQL Single Instance Mode
# Configure postgres via pgserver.postgres_conf (curated whitelist).
#
# pg.sh-orchestrated: reads the _APPINFRA_PG_* wire variables from the
# environment. CONTAINER_NAME / IMAGE / PORT are required; the postgres_conf
# slots default to postgres's built-in values when unset. Not intended for
# direct `docker compose -f ...` invocation.
services:
  postgres:
    container_name: ${_APPINFRA_PG_CONTAINER_NAME:?}
    image: ${_APPINFRA_PG_IMAGE:?}
    command:
      - postgres
      - -c
      - ${_APPINFRA_PG_MAX_CONNECTIONS:-max_connections=128}
      - -c
      - ${_APPINFRA_PG_SHARED_PRELOAD_LIBRARIES:-shared_preload_libraries=}
      - -c
      - ${_APPINFRA_PG_WORK_MEM:-work_mem=4MB}
      - -c
      - ${_APPINFRA_PG_AUTOVACUUM:-autovacuum=on}
    restart: always
    volumes:
      - "$PWD:$PWD"
      # Mount one level above PGDATA: pg18+ uses /var/lib/postgresql/<MAJOR>/docker
      # and refuses to start when the mount lands on /var/lib/postgresql/data.
      - pgdata:/var/lib/postgresql
    working_dir: $PWD
    ports:
      - ${_APPINFRA_PG_PORT:?}:${_APPINFRA_PG_PORT}
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - PGPORT=${_APPINFRA_PG_PORT}

volumes:
  pgdata:
