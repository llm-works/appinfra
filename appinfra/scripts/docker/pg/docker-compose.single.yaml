# PostgreSQL Single Instance Mode
# Configure postgres via pgserver.postgres_conf (curated whitelist).
#
# Makefile-orchestrated: NAME / IMAGE / PORT are required env vars; the PG_*
# slots default to postgres's built-in values when unset. All are set by
# Makefile.pg from the pgserver config. Not intended for direct
# `docker compose -f ...` invocation.
services:
  postgres:
    container_name: ${NAME:?}
    image: ${IMAGE:?}
    command:
      - postgres
      - -c
      - ${PG_MAX_CONNECTIONS:-max_connections=128}
      - -c
      - ${PG_SHARED_PRELOAD_LIBRARIES:-shared_preload_libraries=}
      - -c
      - ${PG_WORK_MEM:-work_mem=4MB}
      - -c
      - ${PG_AUTOVACUUM:-autovacuum=on}
    restart: always
    volumes:
      - "$PWD:$PWD"
    working_dir: $PWD
    ports:
      - ${PORT:?}:${PORT}
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - PGPORT=${PORT}
