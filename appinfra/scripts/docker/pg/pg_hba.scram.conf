# pg_hba.conf for a pgserver with a password (pgserver.pass set).
# pg.sh mounts it as /etc/postgresql/pg_hba.conf (hba_file) in every container.
#
# Connections from inside the container (podman/docker exec, pg.sh's readiness
# probe) stay trusted. Connections through a published port arrive from an
# address on the container network, not 127.0.0.1, and need the password, as
# does the standby's replication connection.
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
host    all             all             all                     scram-sha-256
host    replication     all             all                     scram-sha-256
